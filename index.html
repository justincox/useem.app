<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>em — Coming Soon</title>
<meta name="description" content="em is a markdown writing app for macOS, iPadOS, and iOS. Coming soon.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F1E4;
    --fg: #252525;
    --accent: #347959;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #252525;
      --fg: #F6F1E4;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  main {
    max-width: 34rem;
  }
  h1 {
    margin: 0 0 1rem;
    line-height: 1;
  }
  .wordmark {
    font-family: "Pacifico", cursive;
    font-weight: 400;
    font-size: clamp(4.5rem, 22vw, 9rem);
    color: var(--accent);
    letter-spacing: 0;
  }
  p {
    font-size: 1.15rem;
    line-height: 1.5;
    opacity: 0.8;
    margin: 0 0 1.5rem;
  }
  .tag {
    display: inline-block;
    font-family: "Courier Prime", "SFMono-Regular", ui-monospace, Menlo, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    color: var(--accent);
    opacity: 0.9;
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.3rem 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1><span class="wordmark">em</span></h1>
  <p>A markdown writing app for macOS, iPadOS, and iOS — your library, your folders, your iCloud.</p>
  <span class="tag">coming soon</span>
</main>
</body>
</html>
